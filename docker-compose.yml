# docker-compose.yml
#
# Two services:
#   - hr       : the API (and SPA when built) — single container per §15
#   - hr-redis : dedicated Redis for the BullMQ queue; isolated from any other
#                Redis instance on the homelab
#
# The hr container sits on two networks:
#   - cranberrylabs          : shared external network that Caddy also joins.
#                              Caddy proxies to http://cranberrylabs-hr:3000.
#                              No host port is published — the only ingress is
#                              through Caddy.
#   - cranberrylabs-hr_default : internal network shared only with hr-redis.
#                              Redis is not reachable from the Caddy network.
#
# If your shared proxy network has a different name (e.g. `proxy`, `web`),
# change `cranberrylabs` in the hr service networks list and the external
# networks block below.

services:
  hr:
    build:
      context: .
      dockerfile: Dockerfile
    image: cranberrylabs-hr:latest
    container_name: cranberrylabs-hr
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - CONFIG_PATH=/app/config/production.yaml
      - TZ=America/Toronto
      # Set ANTHROPIC_API_KEY in a .env file (gitignored) in this directory:
      #   ANTHROPIC_API_KEY=sk-ant-api03-...
      # Docker Compose reads .env automatically. The app starts cleanly without
      # it; generation returns a clear error until the key is present.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # SQLite file. Bind mount (not named volume) so it's easy to back up,
      # inspect with `sqlite3` from the host, and survive `docker compose down -v`.
      - ./data:/app/data
      # Generated resumes + cover letters.
      - ./storage:/app/storage
      # Config is read-only inside the container.
      - ./config:/app/config:ro
    depends_on:
      hr-redis:
        condition: service_healthy
    networks:
      - cranberrylabs
      - cranberrylabs-hr_default
    # Resource limits — modest, tune later. The scraper + LLM generation are
    # the heaviest consumers; this leaves headroom for both.
    deploy:
      resources:
        limits:
          memory: 1G

  hr-redis:
    image: redis:7-alpine
    container_name: cranberrylabs-hr-redis
    restart: unless-stopped
    # Persist queue state across restarts. BullMQ relies on Redis to track
    # in-flight jobs — losing this on every restart would orphan applications
    # mid-generation.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    networks:
      - cranberrylabs-hr_default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  cranberrylabs:
    external: true
  cranberrylabs-hr_default:
    # Internal network. Only hr and hr-redis are on it. Redis is not reachable
    # from the cranberrylabs proxy network.
